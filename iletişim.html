<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>İletişim | Portfolyo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <!-- Vue 3 -->
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark">
        <div class="container">
            <a class="navbar-brand" href="index.html">✦ Portfolyo</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="index.html">Hakkımda</a></li>
                    <li class="nav-item"><a class="nav-link" href="cv.html">Özgeçmiş</a></li>
                    <li class="nav-item"><a class="nav-link" href="sehrim.html">Şehrim</a></li>
                    <li class="nav-item"><a class="nav-link" href="mirasimiz.html">Mirasımız</a></li>
                    <li class="nav-item"><a class="nav-link" href="ilgi.html">İlgi Alanlarım</a></li>
                    <li class="nav-item"><a class="nav-link active" href="iletisim.html">İletişim</a></li>
                    <li class="nav-item"><a class="nav-link" href="login.html">Login</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container mt-5" id="app">
        <div class="row">
            <div class="col-md-8 mx-auto card-custom p-5">
                <h2 class="hero-title text-center" style="font-size: 2.5rem;">Bana <span>Ulaşın</span></h2>
                
                <div id="errorMessages" class="alert alert-danger d-none mt-3"></div>
                <div v-if="vueErrors.length" class="alert alert-danger mt-3">
                    <ul>
                        <li v-for="error in vueErrors" :key="error">{{ error }}</li>
                    </ul>
                </div>

                <form id="contactForm" action="php/formislem.php" method="POST" class="mt-4">
                    <div class="mb-3">
                        <label class="form-label fw-bold">Ad Soyad</label>
                        <input type="text" class="form-control" name="adsoyad" id="adsoyad" v-model="formData.adsoyad">
                    </div>
                    
                    <div class="mb-3">
                        <label class="form-label fw-bold">E-posta Adresi</label>
                        <input type="text" class="form-control" name="email" id="email" v-model="formData.email">
                    </div>
                    
                    <div class="mb-3">
                        <label class="form-label fw-bold">Telefon Numarası</label>
                        <input type="text" class="form-control" name="telefon" id="telefon" placeholder="05554443322" v-model="formData.telefon">
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-bold">Cinsiyet</label>
                        <div>
                            <div class="form-check form-check-inline">
                                <input class="form-check-input" type="radio" name="cinsiyet" id="erkek" value="Erkek" v-model="formData.cinsiyet">
                                <label class="form-check-label" for="erkek">Erkek</label>
                            </div>
                            <div class="form-check form-check-inline">
                                <input class="form-check-input" type="radio" name="cinsiyet" id="kadin" value="Kadın" v-model="formData.cinsiyet">
                                <label class="form-check-label" for="kadin">Kadın</label>
                            </div>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-bold">Konu</label>
                        <select class="form-select" name="konu" id="konu" v-model="formData.konu">
                            <option value="">Seçiniz</option>
                            <option value="İş Teklifi">İş Teklifi</option>
                            <option value="Proje">Proje</option>
                            <option value="Diğer">Diğer</option>
                        </select>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-bold">Mesajınız</label>
                        <textarea class="form-control" name="mesaj" id="mesaj" rows="4" v-model="formData.mesaj"></textarea>
                    </div>

                    <div class="mb-4">
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" name="onay" id="onay" value="Evet" v-model="formData.onay">
                            <label class="form-check-label" for="onay">
                                KVKK metnini okudum ve onaylıyorum.
                            </label>
                        </div>
                    </div>

                    <div class="d-grid gap-2 d-md-flex justify-content-md-center">
                        <button type="button" class="btn btn-primary px-4 py-2 me-md-2" id="nativeBtn">Native JS ile Gönder</button>
                        <button type="button" class="btn btn-success px-4 py-2" @click="validateWithVue">Vue.js ile Gönder</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <footer class="footer mt-5">
        <p>&copy; 2026 Web Teknolojileri Projesi</p>
    </footer>

    <script src="js/validation.js"></script>
    <script src="js/vue-validation.js"></script>
</body>
</html>
