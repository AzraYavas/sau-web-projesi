<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>İletişim - Portfolyo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
    <!-- Vue.js (Varsa projedeki kullanımına göre eklendi) -->
    <script src="https://cdn.jsdelivr.net/npm/vue@2.6.14/dist/vue.js"></script>
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-dark">
        <div class="container">
            <a class="navbar-brand" href="index.html">PORTFOLYO</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="index.html">Hakkında</a></li>
                    <li class="nav-item"><a class="nav-link" href="cv.html">Özgeçmiş</a></li>
                    <li class="nav-item"><a class="nav-link" href="sehrim.html">Şehrim</a></li>
                    <li class="nav-item"><a class="nav-link" href="mirasımız.html">Mirasımız</a></li>
                    <li class="nav-item"><a class="nav-link" href="ilgi.html">İlgi Alanlarım</a></li>
                    <li class="nav-item"><a class="nav-link active" href="iletişim.html">İletişim</a></li>
                    <li class="nav-item"><a class="nav-link" href="login.html">Giriş</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <main class="container my-5">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="profile-card" id="app">
                    <h2 class="text-center mb-4 text-primary-blue">Benimle İletişime Geçin</h2>
                    <form action="php/formişlem.php" method="POST" id="contactForm" @submit="checkForm">
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="isim" class="form-label text-muted fw-bold">Ad Soyad</label>
                                <input type="text" class="form-control" id="isim" name="isim" v-model="form.isim" style="border-radius: 10px;">
                                <small v-if="errors.isim" class="text-danger">{{ errors.isim }}</small>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label for="email" class="form-label text-muted fw-bold">E-posta</label>
                                <input type="email" class="form-control" id="email" name="email" v-model="form.email" style="border-radius: 10px;">
                                <small v-if="errors.email" class="text-danger">{{ errors.email }}</small>
                            </div>
                        </div>
                        <div class="mb-3">
                            <label for="konu" class="form-label text-muted fw-bold">Konu Seçiniz</label>
                            <select class="form-select" id="konu" name="konu" v-model="form.konu" style="border-radius: 10px;">
                                <option value="">Lütfen Seçiniz</option>
                                <option value="is_teklifi">İş Teklifi</option>
                                <option value="proje">Proje Danışmanlığı</option>
                                <option value="diger">Diğer</option>
                            </select>
                            <small v-if="errors.konu" class="text-danger">{{ errors.konu }}</small>
                        </div>
                        <div class="mb-4">
                            <label for="mesaj" class="form-label text-muted fw-bold">Mesajınız</label>
                            <textarea class="form-control" id="mesaj" name="mesaj" rows="4" v-model="form.mesaj" style="border-radius: 10px;"></textarea>
                            <small v-if="errors.mesaj" class="text-danger">{{ errors.mesaj }}</small>
                        </div>
                        
                        <div class="text-center">
                            <button type="submit" class="btn btn-primary px-5 py-2 fw-bold" style="background-color: var(--accent-pink); border: none; border-radius: 10px;">Gönder</button>
                            <button type="button" class="btn btn-secondary px-5 py-2 fw-bold ms-2" @click="temizle" style="border-radius: 10px;">Temizle</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </main>

    <footer>
        <div class="container">
            <p class="mb-0">© 2024 Web Teknolojileri Projesi | Sakarya Üniversitesi</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/vue-validation.js"></script>
    <script src="js/validation.js"></script>
</body>
</html>
