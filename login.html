    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark">
        <div class="container">
            <a class="navbar-brand" href="index.html">✦ AZRA YAVAŞ</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="index.html">Hakkımda</a></li>
                    <li class="nav-item"><a class="nav-link" href="cv.html">Özgeçmiş</a></li>
                    <li class="nav-item"><a class="nav-link" href="sehrim.html">Şehrim</a></li>
                    <li class="nav-item"><a class="nav-link" href="mirasimiz.html">Mirasımız</a></li>
                    <li class="nav-item"><a class="nav-link" href="ilgi.html">İlgi Alanlarım</a></li>
                    <li class="nav-item"><a class="nav-link" href="iletisim.html">İletişim</a></li>
                    <li class="nav-item"><a class="nav-link active" href="login.html">Login</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-5">
                <div class="card card-custom p-5">
                    <h2 class="text-center hero-title mb-4" style="font-size: 2rem;">Giriş <span>Yap</span></h2>
                    
                    <!-- Hata mesajı PHP tarafından URL parametresi ile gelirse göstermek için -->
                    <div id="loginAlert" class="alert alert-danger d-none"></div>

                    <form action="php/logKontrol.php" method="POST" id="loginForm" onsubmit="return validateLogin()">
                        <div class="mb-3">
                            <label class="form-label fw-bold">E-posta (Kullanıcı Adı)</label>
                            <input type="text" class="form-control" name="email" id="logEmail" placeholder="b2412100001@sakarya.edu.tr">
                        </div>
                        <div class="mb-4">
                            <label class="form-label fw-bold">Şifre (Öğrenci No)</label>
                            <input type="password" class="form-control" name="password" id="logPassword" placeholder="b2412100001">
                        </div>
                        <button type="submit" class="btn btn-custom w-100">Giriş Yap</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script>
        function validateLogin() {
            const email = document.getElementById('logEmail').value.trim();
            const password = document.getElementById('logPassword').value.trim();
            const alertBox = document.getElementById('loginAlert');
            
            if(email === "" || password === "") {
                alertBox.textContent = "Lütfen tüm alanları doldurunuz.";
                alertBox.classList.remove('d-none');
                return false;
            }
            
            const emailRegex = /^[a-zA-Z0-9]+@sakarya\.edu\.tr$/;
            if(!emailRegex.test(email)) {
                alertBox.textContent = "Geçerli bir Sakarya Üniversitesi e-posta formatı (örn: b2412100001@sakarya.edu.tr) giriniz.";
                alertBox.classList.remove('d-none');
                return false;
            }
            
            return true;
        }

        // PHP de hata var mı diye kontrol
        const urlParams = new URLSearchParams(window.location.search);
        if(urlParams.get('error') === '1') {
            const alertBox = document.getElementById('loginAlert');
            alertBox.textContent = "Kullanıcı adı veya şifre hatalı!";
            alertBox.classList.remove('d-none');
        } else if(urlParams.get('error') === 'empty') {
            const alertBox = document.getElementById('loginAlert');
            alertBox.textContent = "Lütfen tüm alanları doldurunuz.";
            alertBox.classList.remove('d-none');
        }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
